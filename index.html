<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="EXPERT FLEXKIN 3D 힐링 관리실 — 피부 고민을 고르면 잔잔한 음악과 함께 관리가 이어집니다.">
<style>
/* page basics (the claude.ai viewer used to add these) */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}
img{max-width:100%}
</style>
<title>플렉스킨 관리실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D room; ivory paper UI floats over it (brand top, care controls bottom, guide bubble beside the bed/display) */
:root{
  --bg:#120e0b;            /* 3D room surround */
  --ink:#f3e7d6;           /* text on the dark room */
  --muted:#b6a48d;
  --paper:rgba(252,249,243,.94);   /* ivory UI surface */
  --paper-solid:#fcf9f3;
  --paper-2:#f4eee4;
  --p-ink:#2b241d;         /* text on ivory */
  --p-muted:#8a7d6c;
  --p-line:rgba(70,52,30,.12);
  --gold:#b08a52;          /* FLEXKIN brass accent */
  --navy:#1b2a4a;          /* logo navy */
  --f-brand:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important;}
html,body{height:100%;}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;}
#stage{position:fixed;inset:0;}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;}
button{font-family:inherit;}
:is(button):focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

.top{position:fixed;top:0;left:0;right:0;pointer-events:none;z-index:3;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  background:linear-gradient(to bottom,rgba(18,14,11,.6),transparent);padding-bottom:28px;}
.brand{font-family:var(--f-brand);color:#fbf6ee;}
.brand small{display:block;font-size:10px;letter-spacing:.42em;color:#d9ccb8;font-weight:500;}
.brand b{display:block;font-size:20px;letter-spacing:.14em;font-weight:600;margin-top:2px;}
.room{pointer-events:auto;cursor:pointer;text-align:right;line-height:1.45;font-variant-numeric:tabular-nums;color:var(--p-muted);
  background:var(--paper);border:1px solid var(--p-line);border-radius:12px;padding:7px 12px;display:flex;flex-direction:column;align-items:flex-end;gap:1px;
  box-shadow:0 6px 18px rgba(0,0,0,.18);}
.room span{font-size:14px;font-weight:500;color:var(--p-ink);display:flex;align-items:center;gap:6px;}
.room span em{font-family:var(--f-brand);font-style:normal;font-weight:600;letter-spacing:.04em;}
.room small{font-size:11px;}
.room small em{font-style:normal;color:var(--p-ink);}
.top-r{display:flex;align-items:flex-start;gap:8px;}
.music{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:7px;height:38px;padding:0 12px;border-radius:12px;
  background:var(--paper);border:1px solid var(--p-line);color:var(--p-ink);font-size:12.5px;font-weight:500;box-shadow:0 6px 18px rgba(0,0,0,.18);white-space:nowrap;}
.eq{display:flex;align-items:flex-end;gap:2px;height:12px;}
.eq b{display:block;width:2.5px;height:4px;border-radius:1px;background:var(--gold);}
.music.on .eq b{animation:eq 1.6s ease-in-out infinite;}
.music.on .eq b:nth-child(2){animation-delay:-.5s;} .music.on .eq b:nth-child(3){animation-delay:-1s;}
@keyframes eq{0%,100%{height:4px}50%{height:12px}}
@media (prefers-reduced-motion: reduce){ .music.on .eq b{animation:none;height:9px;} }
@media (max-width:420px){ .music span{display:none;} .music{padding:0 11px;} .share span{display:inline;} }
.share svg{width:15px;height:15px;color:var(--gold);flex:none;}
.chev{width:7px;height:7px;border-right:1.5px solid var(--p-muted);border-bottom:1.5px solid var(--p-muted);transform:rotate(45deg) translateY(-2px);display:block;}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#6fbf8a;margin-right:5px;vertical-align:1px;}
.dot.off{background:#c9bca9;}

#flash{position:fixed;inset:0;z-index:5;display:grid;place-items:center;pointer-events:none;opacity:0;background:var(--paper-solid);
  font-family:var(--f-brand);font-weight:600;letter-spacing:.2em;font-size:15px;color:var(--p-ink);}
#flash.go{animation:flash 1.1s ease forwards;}
@keyframes flash{0%{opacity:0}25%{opacity:.95}55%{opacity:.95}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){ #flash.go{animation-duration:.01s;} }

#sheet{position:fixed;inset:0;z-index:7;background:rgba(18,14,11,.45);display:flex;align-items:flex-end;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));}
.sheet-card{width:100%;max-width:520px;max-height:min(80vh,620px);overflow:auto;background:var(--paper-solid);color:var(--p-ink);border:1px solid var(--p-line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.sheet-head b{display:block;font-size:16px;font-weight:600;}
.sheet-head small{display:block;font-size:12px;color:var(--p-muted);margin-top:2px;}
.ghost{font-size:13px;font-weight:500;color:var(--p-ink);background:var(--paper-2);border:1px solid var(--p-line);border-radius:10px;padding:7px 12px;cursor:pointer;}
.room-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;}
.room-card{color:var(--p-ink);text-align:left;cursor:pointer;background:#fff;border:1px solid var(--p-line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0;}
.room-card.here{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);}
.room-card b{font-size:14px;font-weight:500;}
.room-card small{font-size:11px;color:var(--p-muted);font-variant-numeric:tabular-nums;}
.st{align-self:flex-start;font-size:11px;padding:1px 7px;border-radius:999px;}
.st.free{background:#e6f2ea;color:#3f7a54;}
.st.busy{background:#f5ead9;color:#8a6532;}
.sheet-note{margin:0;font-size:12px;color:var(--p-muted);line-height:1.6;}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:3;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
  background:linear-gradient(to top,rgba(18,14,11,.55),transparent);padding-top:30px;}
.hint{font-size:12px;color:#efe5d6;text-shadow:0 1px 6px rgba(0,0,0,.6);text-align:center;}
.cares-wrap{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:680px;
  background:var(--paper);border:1px solid var(--p-line);border-radius:18px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.22);}
.cares-q{margin:0;font-size:15px;font-weight:600;color:var(--p-ink);letter-spacing:-.01em;text-align:center;word-break:keep-all;}
.cares{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%;}
@media (max-width:620px){ .cares{grid-template-columns:repeat(2,minmax(0,1fr));} }
.cares button{min-height:56px;min-width:0;color:var(--p-ink);background:var(--paper-2);border:1px solid transparent;border-radius:12px;padding:8px 10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;}
.cares button b{font-size:14px;font-weight:600;line-height:1.3;word-break:keep-all;}
.cares button small{font-size:11px;color:var(--p-muted);line-height:1.3;word-break:keep-all;}
.cares button:hover{background:#efe5d6;}
.cares button[aria-pressed="true"]{background:#fffdf8;border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);}
.cares button[aria-pressed="true"] small{color:#8a6532;}
/* phones while the guide is open: concerns shrink to one scrollable row under the bubble */
body.guiding-dock .cares-q, body.guiding-dock .hint, body.guiding-dock .row{display:none;}
body.guiding-dock .cares-wrap{padding:6px;border-radius:14px;}
body.guiding-dock .cares{display:flex;overflow-x:auto;scrollbar-width:none;}
body.guiding-dock .cares::-webkit-scrollbar{display:none;}
body.guiding-dock .cares button{flex:none;min-height:40px;padding:6px 12px;}
body.guiding-dock .cares button small{display:none;}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;}
.moods{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--paper);border:1px solid var(--p-line);pointer-events:auto;}
.moods button{font-size:11px;font-weight:500;color:var(--p-muted);background:transparent;border:0;border-radius:999px;padding:5px 10px;cursor:pointer;display:flex;align-items:center;gap:5px;}
.moods button i{width:7px;height:7px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);}
.moods button[aria-pressed="true"]{background:var(--paper-2);color:var(--p-ink);}

#tags{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden;}
.tag{position:absolute;left:0;top:0;will-change:transform;display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:4px 10px 5px;border-radius:11px;background:var(--paper);border:1px solid var(--p-line);white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.15);}
.tag b{font-size:12px;font-weight:500;color:var(--p-ink);}
.tag span{font-size:10px;color:var(--p-muted);}
.tag.me{border-color:var(--gold);}
.tag.me b::before{content:"나";font-size:9px;font-weight:600;color:#fff;background:var(--gold);border-radius:4px;padding:1px 4px;margin-right:5px;vertical-align:1px;}
#toast{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:6;
  width:max-content;max-width:calc(100% - 32px);padding:10px 14px;border-radius:12px;background:var(--paper-solid);color:var(--p-ink);border:1px solid var(--p-line);
  font-size:13px;line-height:1.5;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2);}

/* ---------- healing session: film-style subtitles, a quiet player, one closing card ---------- */
body.session .cares-wrap, body.session .hint, body.session .row, body.session #tags{display:none;}
body.session .bottom{background:none;}
body.session .top{background:none;}
#caption{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:3;pointer-events:none;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:70px 8px;
  background:linear-gradient(to top,rgba(14,10,8,.6),rgba(14,10,8,.25) 60%,transparent);
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
.cap-kicker{margin:0;font-family:var(--f-brand);font-size:11px;font-weight:600;letter-spacing:.16em;color:#dcc18f;min-height:1.2em;transition:opacity 1.1s ease;word-break:keep-all;}
.cap-line{margin:0;max-width:30em;min-height:3.6em;font-size:clamp(16px,2vw,20px);font-weight:500;line-height:1.8;color:#fbf6ee;
  text-shadow:0 1px 14px rgba(0,0,0,.6);word-break:keep-all;text-wrap:balance;transition:opacity 1.1s ease;}
.cap-line.out,.cap-kicker.out{opacity:0;}
#player{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:4;
  width:min(440px,calc(100vw - 32px));display:flex;align-items:center;gap:4px;padding:5px 6px;border-radius:999px;
  background:rgba(43,32,24,.7);border:1px solid rgba(201,168,110,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
#player button{width:38px;height:38px;flex:none;border-radius:50%;border:0;background:transparent;color:#f6efe3;cursor:pointer;display:grid;place-items:center;}
#player button:hover{background:rgba(246,239,227,.08);}
#player svg{width:16px;height:16px;}
.p-track{flex:1;display:flex;gap:3px;min-width:0;padding:0 4px;}
.p-track i{flex:1;height:3px;border-radius:2px;background:rgba(246,239,227,.18);overflow:hidden;position:relative;}
.p-track i b{position:absolute;left:0;top:0;bottom:0;width:0;background:#dcc18f;transition:width .25s linear;}
.p-time{font-size:11.5px;color:#cdbb9f;font-variant-numeric:tabular-nums;min-width:2.6em;text-align:right;}
#finale{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;width:min(460px,calc(100vw - 24px));
  color:#f6efe3;background:rgba(43,32,24,.9);border:1px solid rgba(201,168,110,.6);border-radius:18px;box-shadow:0 18px 44px rgba(0,0,0,.4);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fIn .6s ease both;}
@keyframes fIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){ #finale{animation:none;} .cap-line,.cap-kicker{transition:none;} }
.f-inner{position:relative;padding:18px 18px 14px;display:flex;flex-direction:column;gap:10px;max-height:min(66vh,560px);overflow:auto;overscroll-behavior:contain;}
.f-kicker{margin:0;font-family:var(--f-brand);font-size:11px;font-weight:600;letter-spacing:.16em;color:#dcc18f;}
#fTitle{margin:0;font-size:18px;font-weight:600;line-height:1.45;color:#fdf8f0;word-break:keep-all;text-wrap:balance;padding-right:34px;}
.f-prog{margin:-4px 0 0;font-size:12px;color:#bba98f;word-break:keep-all;}
#fHome{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-block:1px solid rgba(246,239,227,.12);}
#fHome p{margin:0;font-size:14.5px;line-height:1.7;color:#ece2d3;word-break:keep-all;}
.f-label{display:block;font-size:11.5px;color:#bba98f;margin-bottom:6px;}
.cap-thumb{height:64px;width:auto;max-width:90px;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45));transition:opacity 1.1s ease;}
.cap-thumb.out{opacity:0;}
@media (max-width:700px){ .cap-thumb{height:52px;} }
#fUsed{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px;}
.f-tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;min-width:0;padding:10px 6px 8px;border-radius:12px;
  background:linear-gradient(to bottom,#f6f0e6,#ebe2d4);color:#3a2f25;text-align:center;}
.f-tile img{height:70px;width:100%;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(60,40,20,.25));}
.f-tile span{font-size:11.5px;line-height:1.35;word-break:keep-all;}
a.f-tile{text-decoration:none;cursor:pointer;transition:transform .2s ease, box-shadow .2s ease;}
a.f-tile::after{content:"";position:absolute;top:7px;right:7px;width:6px;height:6px;border-top:1.5px solid #9a7a4a;border-right:1.5px solid #9a7a4a;}
a.f-tile:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.18);}
a.f-tile.rec:hover{box-shadow:inset 0 0 0 2px #c9a86e,0 6px 14px rgba(0,0,0,.18);}
a.f-tile:focus-visible{outline:2px solid #dcc18f;outline-offset:2px;}
.f-tile.text{justify-content:center;min-height:116px;}
.f-tile.rec{box-shadow:inset 0 0 0 2px #c9a86e;}
.f-tile em{position:absolute;top:6px;left:6px;font-style:normal;font-size:10px;font-weight:600;color:#fff;background:#b08a52;border-radius:5px;padding:1px 5px;}
.f-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;position:sticky;bottom:-14px;margin:2px -18px -14px;padding:10px 18px 14px;background:linear-gradient(to top,#2b2018 78%,rgba(43,32,24,0));}
.f-btn{font-size:13.5px;font-weight:500;border-radius:11px;padding:11px 12px;cursor:pointer;border:1px solid rgba(246,239,227,.2);background:rgba(246,239,227,.07);color:#f6efe3;text-align:center;text-decoration:none;line-height:1.35;word-break:keep-all;}
.f-btn.primary{background:#dcc18f;border-color:#dcc18f;color:#2a1f17;}
.f-btn[aria-disabled="true"]{opacity:.75;}
.f-x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;border:1px solid rgba(246,239,227,.2);background:rgba(246,239,227,.06);color:#f6efe3;cursor:pointer;display:grid;place-items:center;}
.f-x svg{width:12px;height:12px;}
#player :focus-visible,#finale :focus-visible{outline:2px solid #dcc18f;outline-offset:2px;}
@media (max-width:700px){
  #caption{padding-block:60px 6px;}
  .cap-line{font-size:16px;line-height:1.75;}
  .f-inner{max-height:58vh;}
  .f-actions{grid-template-columns:1fr;}
}
#loading{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:var(--paper-solid);color:var(--p-muted);
  font-family:var(--f-brand);letter-spacing:.3em;font-size:12px;transition:opacity .8s;}
#loading.done{opacity:0;pointer-events:none;}
</style>

</head>
<body>
<div id="stage"></div>
<div id="tags"></div>

<div class="top">
  <div class="brand"><small>EXPERT</small><b>FLEXKIN</b></div>
  <div class="top-r">
  <button class="music share" id="shareBtn" type="button" aria-label="친구에게 공유하기"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10V2.5M5 5.2 8 2.3l3 2.9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 7.5H3.8a1.3 1.3 0 0 0-1.3 1.3v4.4c0 .7.6 1.3 1.3 1.3h8.4c.7 0 1.3-.6 1.3-1.3V8.8c0-.7-.6-1.3-1.3-1.3h-.7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>친구에게 공유</span></button>
  <button class="music" id="musicBtn" type="button" aria-pressed="false" aria-label="음악 켜기"><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i><span>음악 켜기</span></button>
  <button class="room" id="roomBtn" type="button" aria-haspopup="dialog" hidden><span>관리실 <em id="roomNo">01</em> <i class="chev" aria-hidden="true"></i></span><small><i class="dot off" id="dot"></i><em id="count">1명</em> 함께 있어요</small></button>
  </div>
</div>

<div id="toast" hidden></div>
<div id="flash" aria-hidden="true"></div>

<div id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-card">
    <div class="sheet-head"><div><b id="sheetTitle">관리실 선택</b><small id="total">전체 1명 접속 중</small></div><button id="sheetClose" class="ghost" type="button">닫기</button></div>
    <div id="roomList" class="room-list"></div>
    <p class="sheet-note">관리실마다 관리대가 1개예요. 비어 있는 방에 들어가 관리대를 누르면 바로 누울 수 있어요.</p>
  </div>
</div>

<div id="caption" hidden aria-live="polite">
  <img class="cap-thumb out" id="capThumb" alt="" hidden>
  <p class="cap-kicker" id="capKicker"></p>
  <p class="cap-line out" id="capLine"></p>
</div>

<div id="player" hidden role="group" aria-label="관리 진행">
  <button id="pPause" type="button" aria-label="잠시 멈춤"></button>
  <div class="p-track" id="pTrack" aria-hidden="true"></div>
  <span class="p-time" id="pTime"></span>
  <button id="pNext" type="button" aria-label="다음 단계로"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3.2v9.6c0 .4.5.7.8.4L10 8.4c.3-.2.3-.6 0-.8L3.8 2.8c-.3-.3-.8 0-.8.4z" fill="currentColor"/><rect x="11" y="3" width="2" height="10" rx="1" fill="currentColor"/></svg></button>
  <button id="pSound" type="button" aria-label="소리 끄기"></button>

  const robePts = [[0,.1],[.17,.1],[.185,.13],[.182,.21],[.172,.3],[.172,.38],[.165,.44],[.13,.49],[.08,.51],[0,.515]].map(p=>new THREE.Vector2(p[0],p[1]));

  const HEAD_SCALE = 1.18, HEAD_Y = .5;          // big round head on a short body

    [-1,1].forEach(s=>add(G.loop, robeTrim, .06+s*.026, .3, .148, {rz:s*.5, parent:body}).scale.set(1.3,.8,.6));
    add(G.tail1, robeTrim, .048, .245, .148, {rz:.12, parent:body});
    add(G.tail2, robeTrim, .074, .25, .146, {rz:-.15, parent:body});
    add(G.pocket, robeTrim, -.085, .4, .142, {rx:Math.PI/2-.12, parent:body});
    add(G.diamond, navy, -.085, .408, .149, {rz:Math.PI/4, parent:body, cast:false});
    const arm = s => { const sh = new THREE.Group(); sh.position.set(s*.15, .46, 0); body.add(sh);
      add(G.sleeve, robe, 0, -.07, 0, {parent:sh}); add(G.cuff, robeTrim, 0, -.14, 0, {rx:Math.PI/2, parent:sh}); add(G.hand, skinMat, 0, -.175, 0, {parent:sh});

    const armL = arm(-1), armR = arm(1);

    const hairParts = [
      add(G.cap, hair, 0, .21, -.006, {rx:-.38, parent:head}),

      add(G.bun, hair, 0, .42, -.06, H),

      const e = add(G.eye, dark, s*.072, .19, .178, {parent:head, cast:false}); e.scale.set(1.0, 1.35, .5); eyes.push(e);

      const c = add(G.lid, dark, s*.072, .19, .186, {rz:Math.PI, parent:head, cast:false}); c.visible = false; c.userData.side = s; closed.push(c);

  // expressions: 'neutral' | 'sad' | 'happy'; eyesClosed for lying through care
  function setExpression(av, expr, eyesClosed){
    const key = expr + (eyesClosed ? '-z' : '');
    if (av.expr === key) return; av.expr = key;
    const happy = expr === 'happy', sad = expr === 'sad';
    av.open.forEach(o=>o.visible = !eyesClosed && !happy);
    av.closed.forEach(o=>{ o.visible = eyesClosed && !happy; o.rotation.z = Math.PI + (sad ? -o.userData.side * .3 : 0); });

    av.brows.forEach(b=>{ const s = b.userData.side; b.rotation.z = Math.PI/2 + (sad ? -s * .45 : happy ? s * .12 : 0); b.position.y = sad ? .243 : happy ? .258 : .25; });
    av.mSmile.visible = expr === 'neutral'; av.mSad.visible = sad; av.mGrin.visible = happy;
    av.blush.forEach(b=>{ b.material.opacity = happy ? .6 : sad ? .18 : .35; b.scale.setScalar(happy ? 1.25 : 1); });
    av.eyes.forEach(e=>e.scale.set(1, sad ? 1.1 : 1.35, .5));
  }

  /* ---------- poses ---------- */
  const qLie = new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI/2, 0, 0));   // head toward the headrest, face up

  function bedPose(b){ return { key:'b'+b, pos:new THREE.Vector3(beds[b].x, .88, BED_Z - .58 + FACE_UP), quat:qLie.clone(), lie:1 }; }

  const LOUNGE = [[.75,-.65],[-.75,-1.1],[.75,-1.7],[0,-.2],[-1.5,-.4],[1.5,-.3],[-.5,.35],[.6,.4],[-1.6,-1.6],[1.65,-1.95]];

  const MOVE = reduce ? .01 : 1.7;

    if (av.to && av.to.key === pose.key) return;

    av.from = { key:'cur', pos:av.ch.position.clone(), quat:av.ch.quaternion.clone(), lie:av.lie };

  /* =========================================================
     Care rooms: ROOMS identical rooms, one bed each.
     Everyone shares one lobby presence; each page draws only its own room.
     ========================================================= */
  const ROOMS = 10;
  const ADJ = ['졸린','나른한','포근한','말랑한','보송한','느긋한','새근새근','몽글몽글','촉촉한','뽀얀','꾸벅꾸벅','하품하는','꿈꾸는','폭신한','노곤한','살랑살랑'];
  const ANI = ['여우','수달','판다','토끼','고양이','코알라','펭귄','다람쥐','햄스터','알파카','라쿤','곰돌이','양','오리','물범','부엉이'];
  const rnd = n => Math.floor(Math.random()*n);
  const int = (v, n) => Number.isInteger(v) && v >= 0 && v < n ? v : null;
  const two = n => String(n+1).padStart(2,'0');
  const nameOf = s => (int(s.a, ADJ.length) !== null && int(s.b, ANI.length) !== null) ? `${ADJ[s.a]} ${ANI[s.b]} 고객님` : '고객님';

  const me = { a:rnd(ADJ.length), b:rnd(ANI.length), h:rnd(HAIR.length), r:0, bed:-1, at:0, care:null, glow:false, hasLain:false };   // arrives standing, back to the camera
  const all = new Map();                 // everyone in the building: key -> {key, state, isMe}
  all.set('me', { key:'me', state:me, isMe:true });
  const avs = new Map();                 // avatars drawn in MY room: key -> avatar
  const meAv = makeAvatar(me); meAv.tagEl.classList.add('me'); avs.set('me', meAv);

  let room = null, myPeer = 'me', userActed = false, arrived = false;
  setTimeout(()=>{ arrived = true; }, 5000);
  function pushPresence(){ if (room) room.presence({ a:me.a, b:me.b, h:me.h, r:me.r, bed:me.bed, at:me.at, care:me.care, glow:me.glow ? 1 : 0 }).catch(()=>{}); }
  function cleanState(p){
    return { a:int(p.a, ADJ.length), b:int(p.b, ANI.length), h:int(p.h, HAIR.length) ?? 0, r:int(p.r, ROOMS) ?? 0,
      bed: p.bed === 0 ? 0 : -1, at: Number.isFinite(p.at) ? p.at : 0,
      care: (typeof p.care === 'string' && CARES[p.care]) ? p.care : null, glow: p.glow === 1 };
  }

  // one guest per room's bed: the earliest claim wins
  let occ = [];
  function computeOccupancy(){
    occ = Array.from({length:ROOMS}, ()=>null);
    for (const [k, e] of all){
      const s = e.state; if (s.bed < 0) continue;
      const key = e.isMe ? myPeer : k, cur = occ[s.r];
      if (!cur || s.at < cur.at || (s.at === cur.at && key < cur.key)) occ[s.r] = { at:s.at, key, entry:k };
    }
  }
  const peopleIn = r => { let n = 0; for (const e of all.values()) if (e.state.r === r) n++; return n; };
  function freeRoomNear(r){
    for (let d=1; d<ROOMS; d++) for (const c of [r+d, r-d]) if (c >= 0 && c < ROOMS && !occ[c]) return c;
    return -1;
  }

  function refreshAvatars(){
    for (const [k, e] of all){
      const here = e.state.r === me.r;
      if (here && !avs.has(k)) avs.set(k, makeAvatar(e.state));
    }
    for (const [k, av] of avs){
      const e = all.get(k);
      if (k !== 'me' && (!e || e.state.r !== me.r)){ av.dispose(); avs.delete(k); }
    }
  }

  function syncPeers(list){
    const seen = new Set(['me']);
    for (const p of list){
      if (p.kind !== 'viewer') continue;
      if (p.sameTab){ myPeer = p.peer; continue; }
      seen.add(p.peer);
      const st = cleanState(p.presence || {});
      const e = all.get(p.peer);
      if (e) e.state = st; else all.set(p.peer, { key:p.peer, state:st, isMe:false });
    }
    for (const k of [...all.keys()]) if (!seen.has(k)) all.delete(k);
    resolveBeds();
    refreshAvatars();
    if (!sheet.hidden) renderRoomList();
  }

  function resolveBeds(){
    computeOccupancy();
    if (me.bed >= 0 && occ[me.r] && occ[me.r].entry !== 'me'){
      const lost = me.r, other = all.get(occ[lost].entry), next = freeRoomNear(lost);

  /* ---------- music: "FLEXKIN Private Spa", an original ambient piece made for this space ----------
     (D-flat major, 60 BPM, 192 s; rendered offline by compose.py to music/flexkin-spa.mp3). It starts after the first touch
     (browsers block sound before that), fades in over 3 s, plays at a low level everywhere —
     lounge, care and closing card alike — and never restarts when the guest moves or a step changes.
     The end of the track crossfades into its start so the loop point is not heard.
     If the file is missing or cannot load, the music buttons hide and nothing else is affected. */
  const MUSIC_SRC = 'music/flexkin-spa.mp3';
  const MUSIC_LEVEL = .4;                                  // soft background level (the file itself is mastered quietly)
  const FADE_IN = 3, FADE_OUT = 1.5, LOOP_XFADE = 6;       // seconds
  audio.els = [0, 1].map(k=>{
    const el = new Audio(); el.preload = k ? 'none' : 'metadata'; el.src = MUSIC_SRC; el.playsInline = true;
    el.setAttribute('playsinline', ''); el.volume = 0;
    el.addEventListener('error', ()=>{ if (k === 0 || !audio.started) musicMissing(); });
    return el;
  });
  audio.cur = 0;
  function musicMissing(){
    if (audio.missing) return;
    audio.missing = true; audio.started = false;
    audio.els.forEach(el=>{ try { el.pause(); } catch(e){} });
    ['musicBtn', 'pSound'].forEach(id=>{ const b = gid(id); if (b) b.hidden = true; });
    setSoundIcon();

  function audioStart(){
    if (audio.missing) return;
    try {

        const master = audio.master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);

          ctx.createMediaElementSource(el).connect(g); g.connect(master); el.volume = 1;
          return g;
        });

    } catch(e){ audio.ctx = null; audio.master = null; audio.gains = null; }
    const el = audio.els[audio.cur];
    const p = el.play();
    if (p && p.catch) p.catch(()=>{ /* blocked or failed: stay quiet, the button still works */ });

  // crossfade the end of the track into a fresh start on the second player
  function loopWatch(){
    if (!audio.started || !audio.on || audio.missing || audio.xfading) return;
    const a = audio.els[audio.cur], d = a.duration;
    if (!isFinite(d) || d <= 0) return;
    if (d < LOOP_XFADE * 3){ a.loop = true; return; }     // short clip: plain loop
    if (a.currentTime < d - LOOP_XFADE) return;
    const nk = 1 - audio.cur, b = audio.els[nk];
    audio.xfading = true;
    b.preload = 'auto'; try { b.currentTime = 0; } catch(e){}
    const p = b.play(); if (p && p.catch) p.catch(()=>{});
    const t0 = performance.now();
    const step = ()=>{
      const f = Math.min(1, (performance.now() - t0) / (LOOP_XFADE * 1000));
      // equal-power curve keeps the level steady through the overlap
      const ga = Math.cos(f * Math.PI / 2), gb = Math.sin(f * Math.PI / 2);
      if (audio.gains){ audio.gains[audio.cur].gain.value = ga; audio.gains[nk].gain.value = gb; }

  /* ---------- camera glides (the viewer can still drag at any time) ---------- */
  // the opening view: framed on the customer lying on the bed (a little wider on narrow phones)
  function openingView(){

  }
  updateUI();
  setTimeout(()=>{ if (audio.on && !audio.started && !audio.missing) toast('화면을 한 번 누르시면 잔잔한 음악이 흘러요'); }, 2600);
  tick();
  document.getElementById('loading').classList.add('done');

  /* ---------- connect to everyone who has this page open ---------- */
  const dot = document.getElementById('dot');
  // on your own (no shared room), lie down shortly after arriving so the customer is always on the bed

  try { room = window.claude && window.claude.use ? await window.claude.use('room') : null; } catch(e){ room = null; }

  if (room){
    pushPresence();
    let placed = false;
    room.onPeers(ch => {
      syncPeers(ch.peers);
      // on arrival, after the room has had a moment to answer, pick a room with a free bed
      if (!placed){ placed = true; setTimeout(()=>{
        if (userActed || me.bed >= 0) return;
        computeOccupancy();
        let pick = -1;
        for (let i=0;i<ROOMS;i++) if (!occ[i] && peopleIn(i) - (i === me.r ? 1 : 0) === 0){ pick = i; break; }
        if (pick < 0) for (let i=0;i<ROOMS;i++) if (!occ[i]){ pick = i; break; }
        if (pick < 0){ let best = Infinity; for (let i=0;i<ROOMS;i++){ const n = peopleIn(i); if (n < best){ best = n; pick = i; } } }
        if (pick !== me.r){ moveToRoom(pick, false); toast(`관리실 ${two(pick)}로 안내해 드렸어요`); }
      }, 1500); }
    }, () => dot.classList.add('off'));
    room.onConnection(ok => dot.classList.toggle('off', !ok), () => dot.classList.add('off'));
  }
})();
</script>
